<script>
    $(document).ready(function () {
        var path = window.location.pathname;

        // Normalize trailing slash
        if (path.endsWith('/')) {
            path = path.slice(0, -1);
        }

        var knownTemplates = [
            'dashboard', 'reservations', 'reservation-application',
            'management-fees', 'notice-board', 'service-requests',
            'volunteer-credits', 'profile'
        ];

        // 1. Resolve base path dynamically
        var basePath = '/';
        var pathSegments = path.split('/');
        if (pathSegments.length > 1 && pathSegments[1] !== '' && knownTemplates.indexOf(pathSegments[1]) === -1 && pathSegments[1] !== 'template.php') {
            basePath = '/' + pathSegments[1] + '/';
        }


        // 3. Detect and highlight active menu items
        var currentActive = 'dashboard';

        var urlParams = new URLSearchParams(window.location.search);
        var queryTemplate = urlParams.get('template');

        if (queryTemplate) {
            currentActive = queryTemplate;
        } else {
            var lastSegment = pathSegments[pathSegments.length - 1];
            if (knownTemplates.indexOf(lastSegment) !== -1) {
                currentActive = lastSegment;
            }
        }

        // Apply active classes
        $('header a[data-target]').each(function () {
            var target = $(this).attr('data-target');
            if (target === currentActive) {
                $(this).addClass('bg-blue-50 text-blue-700 font-semibold');
                $(this).removeClass('text-gray-600 hover:bg-gray-50 hover:text-gray-900');
                $(this).find('.material-icons').addClass('text-blue-700');
            } else {
                $(this).removeClass('bg-blue-50 text-blue-700 font-semibold');
                $(this).addClass('text-gray-600 hover:bg-gray-50 hover:text-gray-900');
                $(this).find('.material-icons').removeClass('text-blue-700');
            }
        });

        // 4. Mobile Menu toggle logic
        $('#mobile-menu-btn').click(function (e) {
            e.stopPropagation();
            var $menu = $('#mobile-menu');
            if ($menu.hasClass('hidden')) {
                $menu.removeClass('hidden');
                $(this).find('.material-icons').text('close');
            } else {
                $menu.addClass('hidden');
                $(this).find('.material-icons').text('menu');
            }
        });

        // Close mobile menu when clicking outside
        $(document).click(function (e) {
            if (!$(e.target).closest('#mobile-menu, #mobile-menu-btn').length) {
                $('#mobile-menu').addClass('hidden');
                $('#mobile-menu-btn').find('.material-icons').text('menu');
            }
        });
    });
</script>
